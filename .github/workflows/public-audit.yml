name: Private candidate provenance and secrets
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require private repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" = true
      - name: Mixed assets, license boundaries and history privacy
        run: python3 scripts/audit_public.py
      - name: Gitleaks full-history scan
        run: |
          mkdir -p build/public-audit
          curl --fail --silent --show-error --location -o build/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error --location -o build/gitleaks-checksums.txt https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          expected=$(awk '$2 == "gitleaks_8.30.1_linux_x64.tar.gz" {print $1}' build/gitleaks-checksums.txt)
          test -n "$expected"
          printf '%s  build/gitleaks.tar.gz\n' "$expected" | sha256sum --check
          tar -xzf build/gitleaks.tar.gz -C build gitleaks
          build/gitleaks git . --redact --log-opts=--all --report-format json --report-path build/public-audit/gitleaks.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: public-readiness-${{ github.sha }}
          path: build/public-audit
          retention-days: 14
