name: Provenance and secrets
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Mixed assets, license boundaries and history privacy
        run: python3 scripts/audit_public.py
      - name: Reject tracked macOS backups
        run: |
          python3 - <<'PYTEST'
          import os, pathlib, shutil, subprocess, tempfile
          with tempfile.TemporaryDirectory() as temporary:
              index = pathlib.Path(temporary) / 'index'
              original = subprocess.check_output(['git', 'rev-parse', '--git-path', 'index'], text=True).strip()
              shutil.copyfile(original, index)
              environment = dict(os.environ, GIT_INDEX_FILE=str(index))
              blob = subprocess.check_output(['git', 'hash-object', '-w', '--stdin'], input=b'{}').decode().strip()
              subprocess.run(['git', 'update-index', '--add', '--cacheinfo', '100644', blob, 'configuration-backup-check.json'], env=environment, check=True)
              result = subprocess.run(['python3', 'scripts/audit_public.py'], env=environment, text=True, capture_output=True)
              assert result.returncode != 0 and 'Private configuration or backup is tracked' in result.stderr, result.stderr
          with tempfile.TemporaryDirectory() as temporary:
              checkout = pathlib.Path(temporary) / 'repository'
              subprocess.run(['git', 'clone', '--quiet', '--shared', '.', str(checkout)], check=True)
              def git(*args):
                  subprocess.run(['git', '-C', str(checkout), *args], check=True, capture_output=True)
              git('config', 'user.name', 'Backup guard check')
              git('config', 'user.email', 'audit@users.noreply.github.com')
              backup = checkout / 'configuration-backup-check.json'
              shutil.copyfile(checkout / 'Sources/StratagemCore/Resources/desktop-examples.json', backup)
              git('add', '-f', backup.name)
              git('commit', '-m', 'Add copied backup fixture')
              git('rm', backup.name)
              git('commit', '-m', 'Remove backup fixture')
              result = subprocess.run(['python3', 'scripts/audit_public.py'], cwd=checkout, text=True, capture_output=True)
              assert result.returncode != 0 and 'Private configuration or backup in history' in result.stderr, result.stderr
          PYTEST
      - name: Gitleaks full-history scan
        run: |
          mkdir -p build/public-audit
          curl --fail --silent --show-error --location -o build/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error --location -o build/gitleaks-checksums.txt https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          expected=$(awk '$2 == "gitleaks_8.30.1_linux_x64.tar.gz" {print $1}' build/gitleaks-checksums.txt)
          test -n "$expected"
          printf '%s  build/gitleaks.tar.gz\n' "$expected" | sha256sum --check
          tar -xzf build/gitleaks.tar.gz -C build gitleaks
          build/gitleaks git . --redact --log-opts=--all --report-format json --report-path build/public-audit/gitleaks.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: public-readiness-${{ github.sha }}
          path: build/public-audit
          retention-days: 14
